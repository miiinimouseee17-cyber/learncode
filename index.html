<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Learning Hub</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

:root{
    --bg:#0f172a;
    --sidebar:#111827;
    --card:#1e293b;
    --border:#334155;
    --text:#ffffff;
    --muted:#94a3b8;
    --accent:#2563eb;
    --green:#22c55e;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.header{
    height:70px;
    background:var(--sidebar);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:24px;
    font-weight:700;
}

.search{
    width:280px;
    padding:12px;
    border:none;
    outline:none;
    background:var(--card);
    color:white;
    border-radius:10px;
}

.container{
    display:grid;
    grid-template-columns:340px 1fr;
    height:calc(100vh - 70px);
}

.sidebar{
    background:var(--sidebar);
    padding:20px;
    overflow-y:auto;
    border-right:1px solid var(--border);
}

.player-area{
    padding:20px;
    overflow-y:auto;
}

.add-box{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:25px;
}

input,button{
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:14px;
}

input{
    background:var(--card);
    color:white;
}

button{
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:600;
}

.course-card{
    background:var(--card);
    border-radius:15px;
    overflow:hidden;
    margin-bottom:15px;
    cursor:pointer;
    transition:.2s;
}

.course-card:hover{
    transform:translateY(-4px);
}

.thumbnail{
    width:100%;
    height:180px;
    object-fit:cover;
}

.course-content{
    padding:15px;
}

.course-title{
    font-size:15px;
    font-weight:600;
    margin-bottom:10px;
}

.course-meta{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:13px;
}

.video-container{
    background:var(--sidebar);
    border-radius:20px;
    overflow:hidden;
}

#player{
    width:100%;
    aspect-ratio:16/9;
}

.video-info{
    padding:20px;
}

.video-title{
    font-size:28px;
    margin-bottom:15px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.secondary{
    background:var(--card);
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:50px 0;
}

@media(max-width:1000px){

    .container{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-height:350px;
    }

    .search{
        width:150px;
    }

    .video-title{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">📚 Learning Hub</div>

    <input
        class="search"
        id="search"
        placeholder="Search..."
        oninput="renderCourses()">
</div>

<div class="container">

    <div class="sidebar">

        <div class="add-box">

            <input
                id="title"
                placeholder="Course title">

            <input
                id="url"
                placeholder="Paste YouTube link">

            <button onclick="addCourse()">
                Add Course
            </button>

        </div>

        <div id="courseList"></div>

    </div>

    <div class="player-area">

        <div class="video-container">

            <div id="player"></div>

            <div class="video-info">

                <h1
                    class="video-title"
                    id="currentTitle">
                    Select a Course
                </h1>

                <div class="actions">

                    <button
                        onclick="fullscreenPlayer()">
                        ⛶ Fullscreen
                    </button>

                    <button
                        class="secondary"
                        onclick="toggleFavorite()">
                        ⭐ Favorite
                    </button>

                    <button
                        class="secondary"
                        onclick="deleteCurrent()">
                        🗑 Delete
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const STORAGE="learning_hub";

let player;
let playerReady=false;
let currentIndex=null;

function getCourses(){
    return JSON.parse(
        localStorage.getItem(STORAGE)
        ||"[]"
    );
}

function saveCourses(data){
    localStorage.setItem(
        STORAGE,
        JSON.stringify(data)
    );
}

function extractID(url){

    try{

        const u=new URL(url);

        if(u.searchParams.get("v"))
            return u.searchParams.get("v");

        if(u.hostname.includes("youtu.be"))
            return u.pathname.slice(1);

        if(u.pathname.includes("/shorts/"))
            return u.pathname.split(
                "/shorts/"
            )[1];

        return null;

    }catch{
        return null;
    }
}

function addCourse(){

    const title=
        document
        .getElementById(
            "title"
        ).value.trim();

    const url=
        document
        .getElementById(
            "url"
        ).value.trim();

    const id=
        extractID(url);

    if(!title || !id){
        alert(
          "Invalid YouTube URL"
        );
        return;
    }

    const courses=
        getCourses();

    courses.push({
        title,
        id,
        favorite:false
    });

    saveCourses(courses);

    document
    .getElementById(
        "title"
    ).value="";

    document
    .getElementById(
        "url"
    ).value="";

    renderCourses();
}

function renderCourses(){

    const search=
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase();

    const courses=
        getCourses();

    const list=
        document
        .getElementById(
            "courseList"
        );

    list.innerHTML="";

    if(courses.length===0){

        list.innerHTML=
        `<div class="empty">
            No courses yet
        </div>`;

        return;
    }
      courses.forEach((course,index)=>{

        if(
            !course.title
            .toLowerCase()
            .includes(search)
        ) return;

        list.innerHTML += `
        <div class="course-card"
             onclick="playCourse(${index})">

            <img
                class="thumbnail"
                src="https://img.youtube.com/vi/${course.id}/hqdefault.jpg">

            <div class="course-content">

                <div class="course-title">
                    ${
                      course.favorite
                      ? "⭐ "
                      : ""
                    }
                    ${course.title}
                </div>

                <div class="course-meta">

                    <span>
                        YouTube
                    </span>

                    <span>
                        ${
                          course.favorite
                          ? "★"
                          : "☆"
                        }
                    </span>

                </div>

            </div>

        </div>
        `;
    });
}

function onYouTubeIframeAPIReady(){

    player =
    new YT.Player(
        "player",
        {
            playerVars:{
                rel:0,
                modestbranding:1
            },

            events:{

                onReady:()=>{
                    playerReady=true;
                },

                onError:(e)=>{
                    alert(
                      "This video cannot be played in the embedded player."
                    );
                    console.log(e);
                }
            }
        }
    );
}

function playCourse(index){

    if(!playerReady){
        alert(
          "Player still loading..."
        );
        return;
    }

    currentIndex=index;

    const courses=
        getCourses();

    const course=
        courses[index];

    document
    .getElementById(
        "currentTitle"
    ).innerText=
    course.title;

    try{

        player.loadVideoById(
            course.id
        );

    }catch(err){

        console.error(err);

        alert(
          "Unable to play video."
        );
    }
}

function toggleFavorite(){

    if(currentIndex===null)
        return;

    const courses=
        getCourses();

    courses[
        currentIndex
    ].favorite=
    !courses[
        currentIndex
    ].favorite;

    saveCourses(
        courses
    );

    renderCourses();
}

function deleteCurrent(){

    if(currentIndex===null)
        return;

    if(
      !confirm(
       "Delete this course?"
      )
    ) return;

    const courses=
        getCourses();

    courses.splice(
        currentIndex,
        1
    );

    saveCourses(
        courses
    );

    currentIndex=null;

    document
    .getElementById(
        "currentTitle"
    ).innerText=
    "Select a Course";

    renderCourses();
}

function fullscreenPlayer(){

    const iframe=
    document.querySelector(
        "#player iframe"
    );

    if(
       iframe &&
       iframe.requestFullscreen
    ){
        iframe
        .requestFullscreen();
    }
}

renderCourses();

</script>

</body>
</html>
