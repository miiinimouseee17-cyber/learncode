<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Hub</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0f172a;color:#fff;height:100vh;overflow:hidden}
header{
height:70px;background:#111827;display:flex;
align-items:center;justify-content:space-between;
padding:0 25px;border-bottom:1px solid #1f2937
}
.logo{font-size:24px;font-weight:700}
.search{
background:#1f2937;border:none;color:#fff;
padding:12px 15px;border-radius:10px;width:250px
}
.container{
display:grid;
grid-template-columns:330px 1fr;
height:calc(100vh - 70px)
}
.sidebar{
background:#111827;
padding:20px;
overflow-y:auto;
border-right:1px solid #1f2937;
}
.add{
display:flex;
flex-direction:column;
gap:10px;
margin-bottom:20px;
}
input,button{
padding:12px;
border:none;
border-radius:10px;
font-size:14px;
}
input{
background:#1f2937;
color:#fff;
}
button{
background:#2563eb;
color:#fff;
cursor:pointer;
}
.card{
background:#1f2937;
border-radius:15px;
overflow:hidden;
margin-bottom:15px;
cursor:pointer;
transition:.2s;
}
.card:hover{
transform:translateY(-3px);
}
.thumb{
width:100%;
height:170px;
object-fit:cover;
}
.content{
padding:15px;
}
.title{
font-size:15px;
font-weight:600;
margin-bottom:10px;
}
.progress{
height:7px;
background:#334155;
border-radius:20px;
overflow:hidden;
}
.bar{
height:100%;
background:#22c55e;
}
.meta{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:12px;
color:#94a3b8;
}
.player-area{
padding:25px;
overflow:auto;
}
.video-box{
background:#111827;
padding:20px;
border-radius:20px;
}
#player{
width:100%;
aspect-ratio:16/9;
}
.info{
margin-top:20px;
}
.actions{
display:flex;
gap:10px;
margin-top:15px;
}
.star{
font-size:18px;
}
@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
.sidebar{
height:350px;
}
}
</style>
</head>
<body>

<header>
<div class="logo">📚 Learning Hub</div>
<input class="search" id="search" placeholder="Search..."
oninput="render()">
</header>

<div class="container">

<div class="sidebar">

<div class="add">
<input id="title" placeholder="Course title">
<input id="url" placeholder="Paste YouTube link">
<button onclick="addCourse()">Add Course</button>
</div>

<div id="courses"></div>

</div>

<div class="player-area">

<div class="video-box">

<div id="player"></div>

<div class="info">
<h2 id="currentTitle">
Select a course
</h2>

<p id="status">
Progress: 0%
</p>

<div class="actions">
<button onclick="fullscreenPlayer()">
⛶ Fullscreen
</button>
</div>
</div>

</div>

</div>

</div>

<script>
const STORAGE="learninghub";
let player;
let playerReady=false;
let currentCourse=null;
let saveTimer=null;

function db(){
return JSON.parse(
localStorage.getItem(STORAGE)||"[]"
);
}

function save(data){
localStorage.setItem(
STORAGE,
JSON.stringify(data)
);
}

function extractID(url){
try{
const u=new URL(url);

if(u.searchParams.get("v"))
return u.searchParams.get("v");

if(u.hostname.includes("youtu.be"))
return u.pathname.slice(1);

if(u.pathname.includes("/shorts/"))
return u.pathname.split("/shorts/")[1];

return null;
}catch{
return null;
}
}

function addCourse(){

const title=
document.getElementById("title").value.trim();

const url=
document.getElementById("url").value.trim();

const id=extractID(url);

if(!title||!id){
alert("Invalid YouTube link");
return;
}

const data=db();

data.push({
title,
id,
current:0,
percent:0,
favorite:false
});

save(data);

document.getElementById("title").value="";
document.getElementById("url").value="";

render();
}

function toggleFav(i){
const data=db();
data[i].favorite=!data[i].favorite;
save(data);
render();
}

function removeCourse(i){
if(!confirm("Delete course?"))return;
const data=db();
data.splice(i,1);
save(data);
render();
}

function render(){

const search=
document.getElementById("search")
.value.toLowerCase();

const data=db();

const courses=
document.getElementById("courses");

courses.innerHTML="";

data.forEach((c,i)=>{

if(!c.title
.toLowerCase()
.includes(search))
return;

courses.innerHTML+=`
<div class="card"
onclick="playCourse(${i})">

<img class="thumb"
src="https://img.youtube.com/vi/${c.id}/hqdefault.jpg">

<div class="content">

<div class="title">
${c.favorite?"⭐ ":""}${c.title}
</div>

<div class="progress">
<div class="bar"
style="width:${c.percent}%">
</div>
</div>

<div class="meta">
<span>${c.percent}%</span>

<span onclick="
event.stopPropagation();
toggleFav(${i});
">
${c.favorite?"★":"☆"}
</span>

<span onclick="
event.stopPropagation();
removeCourse(${i});
">
🗑
</span>
</div>

</div>
</div>
`;
});
}

function onYouTubeIframeAPIReady(){

player=new YT.Player(
"player",
{
playerVars:{
rel:0,
modestbranding:1
},
events:{
onReady:()=>{
playerReady=true;
},
onStateChange:(e)=>{
if(e.data===YT.PlayerState.PLAYING){
startSaving();
}
}
}
}
);
}

function playCourse(index){

if(!playerReady){
alert("Player loading...");
return;
}

currentCourse=index;

const data=db();
const course=data[index];

document
.getElementById("currentTitle")
.innerText=course.title;

document
.getElementById("status")
.innerText=
`Progress: ${course.percent}%`;

player.loadVideoById({
videoId:course.id,
startSeconds:course.current||0
});
}

function startSaving(){

clearInterval(saveTimer);

saveTimer=setInterval(()=>{

if(currentCourse===null)
return;

try{

const current=
player.getCurrentTime();

const duration=
player.getDuration();

if(duration>0){

const data=db();

data[currentCourse]
.current=current;

data[currentCourse]
.percent=Math.floor(
(current/duration)*100
);

save(data);

document
.getElementById("status")
.innerText=
`Progress: ${
data[currentCourse]
.percent
}%`;

render();
}

}catch(e){}

},5000);
}

function fullscreenPlayer(){

const iframe=
document
.querySelector("#player iframe");

if(iframe?.requestFullscreen)
iframe.requestFullscreen();
}

render();
</script>

</body>
</html>
