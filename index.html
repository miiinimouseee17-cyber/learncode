<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Coding Learning Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    min-height:100vh;
}

header{
    padding:20px;
    background:#111827;
    border-bottom:1px solid #1e293b;
}

header h1{
    font-size:28px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.add-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

input{
    flex:1;
    min-width:250px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:700;
}

.layout{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
}

.sidebar{
    background:#111827;
    border-radius:15px;
    padding:20px;
    height:80vh;
    overflow-y:auto;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
}

.card h3{
    margin-bottom:10px;
    font-size:16px;
}

.progress{
    height:8px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#22c55e;
}

.percent{
    margin-top:8px;
    font-size:13px;
    color:#cbd5e1;
}

.player{
    background:#111827;
    border-radius:15px;
    padding:20px;
}

#player{
    width:100%;
    aspect-ratio:16/9;
}

.info{
    margin-top:20px;
}

.delete{
    margin-top:10px;
    background:#dc2626;
    width:100%;
}

.empty{
    opacity:.6;
    text-align:center;
    margin-top:100px;
}

@media(max-width:900px){
    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        height:auto;
    }
}
</style>
</head>
<body>

<header>
    <h1>📚 My Coding Learning Hub</h1>
</header>

<div class="container">

    <div class="add-box">
        <input
            id="videoTitle"
            placeholder="Course title">

        <input
            id="videoUrl"
            placeholder="Paste YouTube URL">

        <button onclick="addVideo()">
            Add Course
        </button>
    </div>

    <div class="layout">

        <div class="sidebar">
            <div id="videoList" class="video-list"></div>
        </div>

        <div class="player">
            <div id="player"></div>

            <div class="info">
                <h2 id="currentTitle">
                    Select a course
                </h2>
                <p id="watchInfo"></p>
            </div>
        </div>

    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;
let currentVideo=null;
let saveTimer;

const STORAGE="learning_hub_videos";

function getVideos(){
    return JSON.parse(
        localStorage.getItem(STORAGE)
    ) || [];
}

function saveVideos(v){
    localStorage.setItem(
        STORAGE,
        JSON.stringify(v)
    );
}

function extractId(url){

    const reg=
    /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;

    const match=url.match(reg);

    return match ? match[1] : null;
}

function addVideo(){

    const title=
        document.getElementById(
            "videoTitle"
        ).value;

    const url=
        document.getElementById(
            "videoUrl"
        ).value;

    const id=extractId(url);

    if(!title || !id){
        alert("Invalid input");
        return;
    }

    const videos=getVideos();

    videos.push({
        id:id,
        title:title,
        current:0,
        duration:0,
        percent:0
    });

    saveVideos(videos);

    document.getElementById(
        "videoTitle"
    ).value="";

    document.getElementById(
        "videoUrl"
    ).value="";

    render();
}

function render(){

    const videos=getVideos();

    const list=
        document.getElementById(
            "videoList"
        );

    list.innerHTML="";

    if(videos.length===0){
        list.innerHTML=
        '<div class="empty">No courses yet</div>';
        return;
    }

    videos.forEach((v,i)=>{

        list.innerHTML+=`
        <div class="card"
             onclick="loadVideo(${i})">

            <h3>${v.title}</h3>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${v.percent}%">
                </div>
            </div>

            <div class="percent">
                ${v.percent}% watched
            </div>

            <button
              class="delete"
              onclick="event.stopPropagation();deleteVideo(${i})">
              Delete
            </button>

        </div>
        `;
    });
}

function deleteVideo(index){

    const videos=getVideos();

    videos.splice(index,1);

    saveVideos(videos);

    render();
}

function onYouTubeIframeAPIReady(){

    player=new YT.Player(
        "player",
        {
            height:"500",
            width:"100%"
        }
    );
}

function loadVideo(index){

    const videos=getVideos();

    currentVideo=index;

    const vid=videos[index];

    document.getElementById(
        "currentTitle"
    ).innerText=vid.title;

    player.loadVideoById({
        videoId:vid.id,
        startSeconds:vid.current||0
    });

    clearInterval(saveTimer);

    saveTimer=setInterval(()=>{

        try{

            const current=
                player.getCurrentTime();

            const duration=
                player.getDuration();

            if(duration){

                const percent=
                    Math.floor(
                        current/
                        duration*
                        100
                    );

                videos[index].current=
                    current;

                videos[index].duration=
                    duration;

                videos[index].percent=
                    percent;

                saveVideos(videos);

                document
                    .getElementById(
                        "watchInfo"
                    ).innerText=
                    `Progress: ${percent}%`;

                render();
            }

        }catch(e){}

    },5000);
}

render();
</script>

</body>
</html>
